<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check whether a Singapore NRIC has a valid format and checksum." />
    <title>NRIC Validator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Internal tool</p>
      <h1>NRIC Validator</h1>
      <p class="intro">Enter an NRIC to check whether it is valid.</p>

      <form id="validator-form" novalidate>
        <label for="nric">NRIC</label>
        <div class="input-row">
          <input
            id="nric"
            name="nric"
            type="text"
            placeholder="Paste rider's NRIC here"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            aria-describedby="privacy-note result"
          />
          <button type="submit">Check</button>
        </div>
      </form>

      <div id="result" class="result" role="status" aria-live="polite"></div>
      <p id="privacy-note" class="privacy-note">
        This check runs only in your browser. The value is not saved or sent anywhere.
      </p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
